<!-- carrito.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nanito Mangas - Carrito de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h2 class="mb-4">Mi Carrito de Compras </h2>
        <div class="row">
            <div class="col-md-8">
                <div id="lista-carrito" class="list-group mb-3">
                    <!-- Se llena con JS -->
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h4>Resumen del Pedido</h4>
                    <hr>
                    <div class="d-flex justify-content-between fs-4 fw-bold">
                        <span>Total:</span>
                        <span id="total-precio">$0</span>
                    </div>
                    <button class="btn btn-success w-100 mt-3" onclick="alert('¡Gracias por tu compra en NanitoMangas!')">PAGAR</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/logica.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", renderizarCarrito);

        function renderizarCarrito() {
            const contenedor = document.getElementById("lista-carrito");
            const totalSpan = document.getElementById("total-precio");
            let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

            if (carrito.length === 0) {
                contenedor.innerHTML = '<div class="alert alert-info">El carrito está vacío.</div>';
                totalSpan.textContent = "$0";
                return;
            }

            contenedor.innerHTML = "";
            let total = 0;

            carrito.forEach((item, index) => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;

                contenedor.innerHTML += `
                    <div class="list-group-item d-flex align-items-center justify-content-between p-3">
                        <div class="d-flex align-items-center gap-3">
                            <img src="${item.imagen}" style="width: 60px; height: 80px; object-fit: contain;">
                            <div>
                                <h6 class="mb-0 fw-bold">${item.titulo} Vol. ${item.volumen}</h6>
                                <small class="text-muted">$${item.precio.toLocaleString('es-CL')} c/u</small>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-sm btn-outline-secondary" onclick="cambiarCantidad(${index}, -1)">-</button>
                            <span>${item.cantidad}</span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="cambiarCantidad(${index}, 1)">+</button>
                            <button class="btn btn-sm btn-danger ms-2" onclick="eliminarItem(${index})"></button>
                        </div>
                    </div>
                `;
            });

            totalSpan.textContent = `$${total.toLocaleString('es-CL')}`;
        }

        function cambiarCantidad(index, cambio) {
            let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
            carrito[index].cantidad += cambio;
            if (carrito[index].cantidad <= 0) carrito.splice(index, 1);
            localStorage.setItem("carrito", JSON.stringify(carrito));
            renderizarCarrito();
            actualizarContadorCarrito();
        }

        function eliminarItem(index) {
            let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
            carrito.splice(index, 1);
            localStorage.setItem("carrito", JSON.stringify(carrito));
            renderizarCarrito();
            actualizarContadorCarrito();
        }
    </script>
</body>
</html>
